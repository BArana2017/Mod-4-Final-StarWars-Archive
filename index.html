<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Star Wars Character Archive</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500&family=Quicksand:wght@300..700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
<nav class="test">
    <ul class="nav-list">
        <li><a href="#" class="nav__link">Home</a></li>
        <li><a href="#" class="nav__link">Characters</a></li>
    </ul>
</nav>    
<section class="opening">
    <div class="test">
    <div>
<h1 class="site-title">Star Wars Character Archive</h1>
<h2 class="site-subtitle">Explore the universe of Star Wars characters</h2>
    </div>
    <div class="search-bar">
        <input type="text" class="search__input" placeholder="Search for a character...">
        <a href="#"><button class="search-button">Search</button></a>
    </div>
    </div>
</section>
<section class="search">
  <div class="container">
    <h3>Filter by Film Appearances</h3>

    <!-- values -->
    <div class="values">
      <span id="minVal">1</span> - <span id="maxVal">9</span> films
    </div>

    <!-- slider -->
    <div class="range-container">

  <div class="values">
    <span id="minValue">1</span>
    -
    <span id="maxValue">9</span>
  </div>

  <div class="slider">
    <div class="progress" id="progress"></div>

    <input type="range" id="minRange" min="1" max="9" value="1">
    <input type="range" id="maxRange" min="1" max="9" value="9">
  </div>

</div>
    
    <!-- characters -->
    <div id="characterList"></div>

  </div>
</section>
    <script src="script.js"></script>
</body>
</html>
